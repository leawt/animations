<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BM25 Scatter-Gather Query Path</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Design tokens ── */
    :root {
      --bg:          #ffffff;
      --dot:         #cac8c4;
      --dot-opacity: 0.11;
      --text:        #3d3a36;
      --muted:       rgba(61,58,54,0.82);
      --muted2:      rgba(61,58,54,0.7);
      --muted3:      rgba(61,58,54,0.55);
      --border:      #e2e0dc;
      --node-fill:   #ffffff;
      --blue:        #0019FF;
      --blue-faint:  rgba(0,25,255,0.025);
      --blue-border: rgba(0,25,255,0.22);
      --stats-fill:  rgba(0,25,255,0.03);
      --lbl-bg:      rgba(255,255,255,0.92);
      --lbl-text:    rgba(61,58,54,0.85);
      --div-line:    #e8e6e3;
      --div-text:    rgba(61,58,54,0.7);
      --conn-gray:   #d0cdc8;
    }

    html.dark {
      --bg:          #0f0e0b;
      --dot:         rgba(255,255,255,1);
      --dot-opacity: 0.03;
      --text:        #dedad5;
      --muted:       rgba(222,218,213,0.82);
      --muted2:      rgba(222,218,213,0.68);
      --muted3:      rgba(222,218,213,0.5);
      --border:      rgba(255,255,255,0.09);
      --node-fill:   #1e1c18;
      --blue:        #5573ff;
      --blue-faint:  rgba(85,115,255,0.06);
      --blue-border: rgba(85,115,255,0.28);
      --stats-fill:  rgba(85,115,255,0.07);
      --lbl-bg:      rgba(18,16,12,0.94);
      --lbl-text:    rgba(222,218,213,0.85);
      --div-line:    rgba(255,255,255,0.08);
      --div-text:    rgba(222,218,213,0.65);
      --conn-gray:   rgba(255,255,255,0.2);
    }

    body {
      background: var(--bg);
      min-height: 100%;
      overflow-x: hidden;
      overflow-y: auto;
      transition: background 0.25s;
    }

    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: radial-gradient(circle, var(--dot) 1px, transparent 1px);
      background-size: 5.5px 5.5px;
      opacity: var(--dot-opacity);
      pointer-events: none;
    }

    .bm25-page {
      position: relative;
      z-index: 1;
      max-width: 640px;
      margin: 0 auto;
      padding: 28px 24px 36px;
      box-sizing: border-box;
    }

    .section-heading {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      text-align: center;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.04em;
      color: var(--muted);
      margin: 0 0 26px;
      padding: 0 8px;
      line-height: 1.5;
    }

    .outer {
      position: relative;
      z-index: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    svg {
      width: 100%;
      max-width: 600px;
      height: auto;
      max-height: none;
      display: block;
      margin: 0 auto;
    }

    /* Knock out dots behind glyphs (matches page bg in light/dark) */
    svg text {
      paint-order: stroke fill;
      stroke: var(--bg);
      stroke-width: 2px;
      stroke-linejoin: round;
    }

    /* ── SVG overrides — presentation attrs have specificity 0, any CSS rule wins ── */

    /* Light mode text (overrides inline presentation attributes) */
    .t-primary  { fill: var(--text) !important; }
    .t-muted    { fill: var(--muted) !important; }
    .t-muted2   { fill: var(--muted2) !important; }
    .t-muted3   { fill: var(--muted3) !important; }
    .t-lbl      { fill: var(--lbl-text) !important; }
    .t-div      { fill: var(--div-text) !important; }

    /* Dark mode node box fills and strokes */
    html.dark .nd-box     { fill: var(--node-fill) !important; stroke: var(--border) !important; }
    html.dark .nd-stats   { fill: var(--stats-fill) !important; stroke: var(--blue-border) !important; }

    /* Text colors */
    html.dark .t-primary  { fill: var(--text) !important; }
    html.dark .t-blue     { fill: var(--blue) !important; }
    html.dark .t-muted    { fill: var(--muted) !important; }
    html.dark .t-muted2   { fill: var(--muted2) !important; }
    html.dark .t-muted3   { fill: var(--muted3) !important; }
    html.dark .t-lbl      { fill: var(--lbl-text) !important; }
    html.dark .t-lbl-blue { fill: var(--blue) !important; }
    html.dark .t-div      { fill: var(--div-text) !important; }

    /* Arrow label backgrounds */
    html.dark .lbl-bg     { fill: var(--lbl-bg) !important; }

    /* Lines */
    html.dark .ln-gray    { stroke: var(--conn-gray) !important; }
    html.dark .ln-blue    { stroke: var(--blue) !important; stroke-opacity: 0.2 !important; }
    html.dark .div-line   { stroke: var(--div-line) !important; }

    /* Packet dots */
    html.dark .pkt        { fill: var(--blue) !important; }

    /* Pulse rings */
    html.dark .pulse      { stroke: var(--blue) !important; }

    /* Arrow marker strokes — can't CSS-override marker internals easily,
       so we use separate markers for dark (defined in SVG defs) */
  </style>
</head>
<body>
<div class="bm25-page">
<p class="section-heading">BM25 statistics for growing and dynamic data</p>
<div class="outer" role="img" aria-label="BM25 scatter-gather: query terms to all slabs; each slab returns precomputed per-term statistics (lookup only); merged global statistics broadcast; each slab returns top-k">

    <path id="m-p1d2" d="M340,113 C340,136 550,140 550,181"/>
    <path id="m-p1u0" d="M130,222 C130,252 340,256 340,278"/>
    <path id="m-p1u1" d="M340,222 L340,278"/>

  <path id="ln-p2u2" class="ln-blue" d="M550,442 C550,468 340,472 340,490"
    fill="none" stroke="#0019FF" stroke-width="1" stroke-opacity="0.18"

  <!-- Global BM25 stats -->
  <g id="nd-stats" opacity="0">
    <rect class="nd-stats" x="146" y="278" width="388" height="70" fill="rgba(0,25,255,0.03)" stroke="rgba(0,25,255,0.22)" stroke-width="1.5"/>
    <text class="t-blue" x="340" y="303" text-anchor="middle" font-size="12" fill="#0019FF" font-weight="500">merged global statistics</text>
    <g id="nd-stats-fields" opacity="0">
      <text class="t-muted" x="188" y="323" font-size="10" fill="rgba(87,83,78,0.6)">total_docs</text>
      <text class="t-muted3" x="270" y="323" font-size="10" fill="rgba(87,83,78,0.28)">·</text>
      <text class="t-muted" x="282" y="323" font-size="10" fill="rgba(87,83,78,0.6)">total_tokens</text>
      <text class="t-muted3" x="370" y="323" font-size="10" fill="rgba(87,83,78,0.28)">·</text>
      <text class="t-muted" x="382" y="323" font-size="10" fill="rgba(87,83,78,0.6)">term_doc_freqs</text>
      <text class="t-muted2" x="340" y="339" text-anchor="middle" font-size="9.5" fill="rgba(87,83,78,0.4)" font-style="italic">all slabs score against the same merged statistics</text>
    </g>
  </g>

  <!-- Slabs pass 2 -->
  <g id="nd-slabs-2" opacity="0">
    <rect class="nd-box" x="80" y="400" width="100" height="43" fill="white" stroke="#e2e0dc" stroke-width="1"/>
    <text class="t-blue" x="130" y="420" text-anchor="middle" font-size="11" fill="#0019FF" font-weight="500">slab_0</text>
    <text class="t-muted2" x="130" y="437" text-anchor="middle" font-size="9.5" fill="rgba(87,83,78,0.45)">score &amp; rank</text>
    <rect class="nd-box" x="290" y="400" width="100" height="43" fill="white" stroke="#e2e0dc" stroke-width="1"/>
    <text class="t-blue" x="340" y="420" text-anchor="middle" font-size="11" fill="#0019FF" font-weight="500">slab_1</text>
    <text class="t-muted2" x="340" y="437" text-anchor="middle" font-size="9.5" fill="rgba(87,83,78,0.45)">score &amp; rank</text>
    <rect class="nd-box" x="500" y="400" width="100" height="43" fill="white" stroke="#e2e0dc" stroke-width="1"/>
    <text class="t-blue" x="550" y="420" text-anchor="middle" font-size="11" fill="#0019FF" font-weight="500">slab_2</text>
    <text class="t-muted2" x="550" y="437" text-anchor="middle" font-size="9.5" fill="rgba(87,83,78,0.45)">score &amp; rank</text>
  </g>

  <!-- Merge / results -->
  <g id="nd-results" opacity="0">
    <rect class="nd-box" x="252" y="488" width="176" height="38" fill="white" stroke="#e2e0dc" stroke-width="1"/>
    <text class="t-primary" x="340" y="506" text-anchor="middle" font-size="12" fill="#57534E" font-weight="500">merge top-k</text>
    <text class="t-muted2" x="340" y="521" text-anchor="middle" font-size="9.5" fill="rgba(87,83,78,0.45)">globally accurate BM25</text>
  </g>

  <!-- Final label -->
  <g id="nd-final" opacity="0">
    <text class="t-muted2" x="340" y="560" text-anchor="middle" font-size="10.5"
      fill="rgba(87,83,78,0.5)" letter-spacing="0.04em">RANKED RESULTS → CLIENT</text>
  </g>

</svg>
</div>
</div>

<script>
(function () {
  'use strict';

  // ── Helpers (defined before initTheme runs) ───────────────────────────────
  const R = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const $ = id => document.getElementById(id);
  const wait = ms => R ? Promise.resolve() : new Promise(r => setTimeout(r, ms));

  // ── Theme ──────────────────────────────────────────────────────────────────
  function applyTheme(t) {
    const dark = t === 'dark';
    document.documentElement.classList.toggle('dark', dark);
    const lnA = $('ln-a'), lnC = $('ln-c');
    const marker = dark ? 'url(#ah-gray-d)' : 'url(#ah-gray-l)';
    if (lnA) lnA.setAttribute('marker-end', marker);
    if (lnC) lnC.setAttribute('marker-end', marker);
  }

  (function initTheme() {
    const param = new URLSearchParams(location.search).get('theme');
    const osDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    applyTheme(param || (osDark ? 'dark' : 'light'));
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
      if (!new URLSearchParams(location.search).get('theme')) applyTheme(e.matches ? 'dark' : 'light');
    });
    window.addEventListener('message', e => {
      if (e.data && (e.data.theme === 'dark' || e.data.theme === 'light')) applyTheme(e.data.theme);
    });
  })();

  function fadeIn(id, ms = 280) {
    const el = $(id); if (!el) return Promise.resolve();
    if (R) { el.setAttribute('opacity', 1); return Promise.resolve(); }
    return new Promise(res => {
      const t0 = performance.now();
      (function tick(now) {
        const p = Math.min((now - t0) / ms, 1);
        el.setAttribute('opacity', 1 - Math.pow(1 - p, 2.2));
        p < 1 ? requestAnimationFrame(tick) : res();
      })(t0);
    });
  }

  function setOp(id, v) { const e=$(id); if(e) e.setAttribute('opacity', v); }

  function fanOut(pkts, ams, lnIds, lblId) {
    if (R) { lnIds.forEach(id => setOp(id,1)); if(lblId) setOp(lblId,1); return Promise.resolve(); }
    return new Promise(res => {
      lnIds.forEach(id => setOp(id, 1));
      pkts.forEach((id,i) => {
        const p=$(id), a=$(ams[i]);
        if(p&&a) { p.setAttribute('opacity',1); a.beginElement(); }
      });
      setTimeout(() => {
        pkts.forEach(id => setOp(id,0));
        if (lblId) fadeIn(lblId, 160);
        res();
      }, 550);
    });
  }

  function pulse(ids) {
    if (R) return Promise.resolve();
    return Promise.all(ids.map(id => new Promise(res => {
      const el=$(id); if(!el){res();return;}
      el.animate(
        [{opacity:0,r:20},{opacity:0.5,r:28},{opacity:0,r:38}],
        {duration:500,easing:'ease-out',fill:'forwards'}
      );
      setTimeout(res, 510);
    })));
  }

  // ── Animation sequence ─────────────────────────────────────────────────────
  async function animate() {
    await wait(700);
    await fadeIn('nd-client', 320); await wait(280);
    setOp('ln-a', 1); await wait(500);
    await wait(900);
    await fadeIn('nd-coord', 300); await wait(500);

    await fadeIn('div-p1', 250); await wait(1100);
    await fanOut(['pk-p1d0','pk-p1d1','pk-p1d2'],['am-p1d0','am-p1d1','am-p1d2'],['ln-p1d0','ln-p1d1','ln-p1d2'],'lbl-query');

    await fadeIn('nd-slabs-1', 220);
    await pulse(['pu-p1-0','pu-p1-1','pu-p1-2']);

    await wait(1400);
    await fanOut(['pk-p1u0','pk-p1u1','pk-p1u2'],['am-p1u0','am-p1u1','am-p1u2'],['ln-p1u0','ln-p1u1','ln-p1u2'],'lbl-stats');

    await wait(1200);
    await fadeIn('nd-stats', 360); await wait(280);
    await fadeIn('nd-stats-fields', 280);

    await wait(900);
    setOp('ln-b', 1); await wait(200);
    await fadeIn('div-p2', 250); await wait(350);
    await wait(800);
    await fanOut(['pk-p2d0','pk-p2d1','pk-p2d2'],['am-p2d0','am-p2d1','am-p2d2'],['ln-p2d0','ln-p2d1','ln-p2d2'],'lbl-idf');

    await fadeIn('nd-slabs-2', 220);
    await pulse(['pu-p2-0','pu-p2-1','pu-p2-2']);

    await wait(1400);
    await fanOut(['pk-p2u0','pk-p2u1','pk-p2u2'],['am-p2u0','am-p2u1','am-p2u2'],['ln-p2u0','ln-p2u1','ln-p2u2'],'lbl-topk');

    await wait(400);
    await fadeIn('nd-results', 320); await wait(280);
    setOp('ln-c', 1); await wait(200);
    await fadeIn('nd-final', 280);
    await wait(400);
  }

  if (R) {
    ['nd-client','ln-a','nd-coord','div-p1','nd-slabs-1',
     'ln-p1d0','ln-p1d1','ln-p1d2','ln-p1u0','ln-p1u1','ln-p1u2','lbl-query','lbl-stats',
     'nd-stats','nd-stats-fields','ln-b','div-p2','nd-slabs-2',
     'ln-p2d0','ln-p2d1','ln-p2d2','ln-p2u0','ln-p2u1','ln-p2u2','lbl-idf','lbl-topk',
     'nd-results','ln-c','nd-final',
    ].forEach(id => setOp(id, 1));
  } else {
    new IntersectionObserver(entries => {
      if (entries[0].isIntersecting) animate();
    }, { threshold: 0.2 }).observe(document.querySelector('.bm25-page'));
  }
})();
</script>
</body>
</html>
