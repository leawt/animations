<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tokenizer Pipeline</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Design tokens ── */
    :root {
      --bg:            #ffffff;
      --dot:           #b8b5b0;
      --dot-opacity:   0.4;
      --text:          #3d3a36;
      --muted:         rgba(61,58,54,0.75);
      --muted2:        rgba(61,58,54,0.7);
      --border:        #e2e0dc;
      --border2:       #e4e2de;
      --divider:       #f0eeeb;
      --card-bg:       rgba(255,255,255,0.97);
      --card-shadow:   rgba(0,0,0,0.07);
      --token-bg:      #faf9f7;
      --shadow-bg:     #ffffff;
      --shadow-border: #ece9e5;
      --input-bg:      rgba(255,255,255,0.9);
      --blue:          #0019FF;
      --blue-bg:       rgba(0,25,255,0.04);
      --blue-border:   rgba(0,25,255,0.16);
      --blue-btn:      rgba(0,25,255,0.3);
      --blue-focus:    rgba(0,25,255,0.35);
      --dot-active:    #0019FF;
      --dot-done:      rgba(0,25,255,0.28);
      --dot-inactive:  #e2e0dc;
      --chip-bg:       #0019FF;
      --chip-text:     #ffffff;
      --removed-text:  rgba(61,58,54,0.45);
    }

    html.dark {
      --bg:            #0f0e0b;
      --dot:           rgba(255,255,255,1);
      --dot-opacity:   0.07;
      --text:          #dedad5;
      --muted:         rgba(222,218,213,0.78);
      --muted2:        rgba(222,218,213,0.68);
      --border:        rgba(255,255,255,0.09);
      --border2:       rgba(255,255,255,0.1);
      --divider:       rgba(255,255,255,0.06);
      --card-bg:       rgba(22,20,16,0.97);
      --card-shadow:   rgba(0,0,0,0.45);
      --token-bg:      #1e1c18;
      --shadow-bg:     #1c1a16;
      --shadow-border: rgba(255,255,255,0.06);
      --input-bg:      rgba(22,20,16,0.9);
      --blue:          #5573ff;
      --blue-bg:       rgba(85,115,255,0.08);
      --blue-border:   rgba(85,115,255,0.22);
      --blue-btn:      rgba(85,115,255,0.3);
      --blue-focus:    rgba(85,115,255,0.4);
      --dot-active:    #5573ff;
      --dot-done:      rgba(85,115,255,0.32);
      --dot-inactive:  rgba(255,255,255,0.1);
      --chip-bg:       #3350ee;
      --chip-text:     #ffffff;
      --removed-text:  rgba(202,198,192,0.28);
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 556px;
      overflow: hidden;
      transition: background 0.25s, color 0.25s;
    }

    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: radial-gradient(circle, var(--dot) 1px, transparent 1px);
      background-size: 4.8px 4.8px;
      opacity: var(--dot-opacity);
      pointer-events: none;
    }

    .wrapper {
      position: relative; z-index: 1;
      max-width: 480px;
      margin: 0 auto;
      padding: 14px 20px 12px;
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .pipeline-trail {
      font-family: 'JetBrains Mono', monospace;
      font-size: 8.5px;
      line-height: 1.35;
      color: var(--muted2);
      text-align: center;
      flex-shrink: 0;
      padding: 0 4px;
      max-height: 36px;
      overflow-y: auto;
    }

    /* ── Input row ── */
    .input-row { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .input-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px; color: var(--muted); flex-shrink: 0;
    }
    .input-field {
      flex: 1; min-width: 0;
      font-family: 'JetBrains Mono', monospace; font-size: 12px;
      color: var(--text); border: 1px solid var(--border); border-radius: 0;
      padding: 7px 11px; outline: none; background: var(--input-bg);
      transition: border-color 0.15s, background 0.25s, color 0.25s;
    }
    .input-field:focus { border-color: var(--blue-focus); }
    .run-btn {
      font-family: 'JetBrains Mono', monospace; font-size: 11px;
      color: var(--blue); border: 1px solid var(--blue-btn); border-radius: 0;
      padding: 7px 12px; background: transparent; cursor: pointer; flex-shrink: 0;
      transition: background 0.15s, color 0.25s, border-color 0.25s;
    }
    .run-btn:hover { background: var(--blue-bg); }
    .run-btn:disabled { opacity: 0.3; cursor: default; }

    /* ── Progress dots ── */
    .progress-row {
      display: flex; align-items: center; gap: 5px;
      justify-content: center; flex-shrink: 0;
    }
    .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--dot-inactive);
      transition: background 0.25s, transform 0.25s;
    }
    .dot.active { background: var(--dot-active); transform: scale(1.25); }
    .dot.done   { background: var(--dot-done); }

    /* ── Card stack ── */
    .stack-wrap { flex: 1; position: relative; }

    .shadow-card {
      position: absolute; left: 0; right: 0;
      border-radius: 8px; border: 1px solid var(--shadow-border);
      background: var(--shadow-bg); pointer-events: none;
      transition: background 0.25s, border-color 0.25s;
    }
    .shadow-card.s1 { top: 9px; transform: scale(0.965) translateY(0px); opacity: 0.55; }
    .shadow-card.s2 { top: 18px; transform: scale(0.930) translateY(0px); opacity: 0.32; }

    .card {
      position: relative; z-index: 10;
      background: var(--card-bg);
      border: 1px solid var(--border2); border-radius: 8px;
      box-shadow: 0 2px 14px var(--card-shadow);
      padding: 18px 20px 16px;
      will-change: transform, opacity;
      transition: background 0.25s, border-color 0.25s, box-shadow 0.25s;
    }

    /* Card internals */
    .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 4px; }
    .card-name {
      font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 500;
      color: var(--blue); display: flex; align-items: center; gap: 8px;
      transition: color 0.25s;
    }
    .card-name::before {
      content: ''; width: 8px; height: 8px; border-radius: 50%;
      background: var(--blue); flex-shrink: 0; transition: background 0.25s;
    }
    .card-num { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--muted2); padding-top: 2px; }
    .card-desc { font-size: 12px; color: var(--muted); margin-bottom: 13px; padding-left: 15px; }
    .card-divider { height: 1px; background: var(--divider); margin-bottom: 13px; transition: background 0.25s; }

    /* Token pills */
    .card-tokens {
      display: flex; flex-wrap: wrap; gap: 5px; align-content: flex-start;
      min-height: 48px; max-height: 108px; overflow-y: auto;
    }
    .token {
      font-family: 'JetBrains Mono', monospace; font-size: 11px;
      padding: 4px 9px; border-radius: 0;
      border: 1px solid var(--border2); color: var(--text); background: var(--token-bg);
      opacity: 0; transform: translateY(4px);
      transition: opacity 0.18s ease, transform 0.18s ease,
                  background 0.25s, border-color 0.25s, color 0.25s;
    }
    .token.show { opacity: 1; transform: translateY(0); }
    .token.changed { color: var(--blue); background: var(--blue-bg); border-color: var(--blue-border); }
    .token.removed { color: var(--removed-text); background: transparent; border-color: transparent; text-decoration: line-through; }
    .card-summary { margin-top: 12px; font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--muted2); }
    .card-summary::before { content: '→ '; }

    /* ── Output row ── */
    .output-row {
      display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
      flex-shrink: 0; min-height: 28px; opacity: 0;
      transition: opacity 0.4s ease;
    }
    .output-row.visible { opacity: 1; }
    .output-label { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--muted); }
    .output-chip {
      font-family: 'JetBrains Mono', monospace; font-size: 11px;
      padding: 4px 10px; border-radius: 0;
      background: var(--chip-bg); color: var(--chip-text);
      transition: background 0.25s;
    }

    @media (prefers-reduced-motion: reduce) {
      .token { transition: none !important; opacity: 1 !important; transform: none !important; }
      .output-row { transition: none !important; opacity: 1 !important; }
      .dot, body, .card, .token, .input-field, .run-btn { transition: none !important; }
    }
  </style>
</head>
<body>
<div class="wrapper" role="main" aria-label="Tokenizer pipeline">
  <div class="input-row">
    <span class="input-label">input</span>
    <input class="input-field" type="text"
      value="Machine learning models are Revolutionizing NLP"
      aria-label="Input text" spellcheck="false"/>
    <button class="run-btn" aria-label="Run pipeline">run ▶</button>
  </div>
  <div class="pipeline-trail">SimpleTokenizer → RemoveLongFilter(max_term_len=256) → LowerCaser → StopWordFilter → Stemmer</div>
  <div class="progress-row" aria-label="Stage progress">
    <span class="dot active"></span>
    <span class="dot"></span>
    <span class="dot"></span>
    <span class="dot"></span>
    <span class="dot"></span>
  </div>
  <div class="stack-wrap">
    <div class="shadow-card s2" aria-hidden="true"></div>
    <div class="shadow-card s1" aria-hidden="true"></div>
    <div class="card" role="region" aria-live="polite">
      <div class="card-header">
        <div class="card-name">SimpleTokenizer</div>
        <div class="card-num">1 / 5</div>
      </div>
      <div class="card-desc">split on whitespace &amp; punctuation</div>
      <div class="card-divider"></div>
      <div class="card-tokens"></div>
      <div class="card-summary"></div>
    </div>
  </div>
  <div class="output-row" aria-live="polite">
    <span class="output-label">indexed →</span>
  </div>
</div>
<script>
(function () {
  'use strict';

  // ── Theme ──────────────────────────────────────────────────────────────────
  function applyTheme(t) {
    document.documentElement.classList.toggle('dark', t === 'dark');
  }
  (function initTheme() {
    const param = new URLSearchParams(location.search).get('theme');
    const osDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    applyTheme(param || (osDark ? 'dark' : 'light'));
    // OS preference changes (only if no explicit param)
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
      if (!new URLSearchParams(location.search).get('theme')) applyTheme(e.matches ? 'dark' : 'light');
    });
    // postMessage from parent site's dark mode toggle
    window.addEventListener('message', e => {
      if (e.data && (e.data.theme === 'dark' || e.data.theme === 'light')) applyTheme(e.data.theme);
    });
  })();

  // ── Stop words ────────────────────────────────────────────────────────────
  const STOP = new Set([
    'a','an','and','are','as','at','be','been','being','but','by',
    'did','do','does','for','from','had','has','have','he','her',
    'him','his','how','i','if','in','into','is','it','its','me',
    'my','no','nor','not','of','on','or','our','out','she','so',
    'than','that','the','their','them','then','there','these','they',
    'this','those','to','too','up','us','was','we','were','what',
    'when','where','which','who','whom','why','will','with','would',
    'you','your','yet','both','either','neither','each','every',
    'any','all','few','more','most','other','some','such','own',
    'same','very','just','can','could','may','might','must','shall',
    'should','well','also','even','still','back','over','after',
    'before','again','once','here','about','above','between',
    'through','during','without','within','along','across',
  ]);

  // ── Porter stemmer ────────────────────────────────────────────────────────
  function stem(w) {
    if (w.length <= 2) return w;
    const hasV = s => /[aeiou]/.test(s);
    if      (w.endsWith('sses')) w = w.slice(0,-2);
    else if (w.endsWith('ies'))  w = w.slice(0,-2)+'i';
    else if (!w.endsWith('ss') && w.endsWith('s') && w.length>2) w = w.slice(0,-1);
    let v=false;
    if      (w.endsWith('eed') && hasV(w.slice(0,-3))) w=w.slice(0,-1);
    else if (w.endsWith('ing') && hasV(w.slice(0,-3))) { w=w.slice(0,-3); v=true; }
    else if (w.endsWith('ed')  && hasV(w.slice(0,-2))) { w=w.slice(0,-2); v=true; }
    if (v) {
      if (w.endsWith('at')||w.endsWith('bl')||w.endsWith('iz')) w+='e';
      else if (/([^aeiouylsz])\1$/.test(w)) w=w.slice(0,-1);
    }
    if (w.length>2 && w.endsWith('y') && hasV(w.slice(0,-1))) w=w.slice(0,-1)+'i';
    for (const [s,r] of [['ational','ate'],['tional','tion'],['enci','ence'],['anci','ance'],['izer','ize'],['abli','able'],['alli','al'],['entli','ent'],['eli','e'],['ousli','ous'],['ization','ize'],['ation','ate'],['ator','ate'],['alism','al'],['iveness','ive'],['fulness','ful'],['ousness','ous'],['aliti','al'],['iviti','ive'],['biliti','ble']]) { if (w.endsWith(s)){const b=w.slice(0,-s.length);if(b.length>1&&hasV(b)){w=b+r;break;}} }
    for (const [s,r] of [['icate','ic'],['ative',''],['alize','al'],['iciti','ic'],['ical','ic'],['ful',''],['ness','']]) { if (w.endsWith(s)){const b=w.slice(0,-s.length);if(b.length>1&&hasV(b)){w=b+r;break;}} }
    for (const s of ['ement','ment','ance','ence','able','ible','ant','ent','ion','ou','ism','ate','iti','ous','ive','ize','al','er','ic']) { if(w.endsWith(s)){const b=w.slice(0,-s.length);if(s==='ion'&&!/[st]$/.test(b))continue;if(b.length>1&&hasV(b)){w=b;break;}} }
    if (w.endsWith('e')){const b=w.slice(0,-1);if(b.length>2&&hasV(b))w=b;}
    if (w.length>3&&w.endsWith('ll')&&hasV(w.slice(0,-2)))w=w.slice(0,-1);
    return w;
  }

  const MAX_TERM_LEN = 256;

  // ── Pipeline ──────────────────────────────────────────────────────────────
  function pipeline(input) {
    const raw = input.split(/[\s!"#$%&'()*+,\-./:;<=>?@[\\\]^_`{|}~]+/).filter(Boolean);
    const s0 = raw.map(t => ({ text: t, removed: false }));
    const s1 = s0.map(t => ({ text: t.text, removed: t.text.length > MAX_TERM_LEN }));
    const s2 = s1.map(t => ({ text: t.text.toLowerCase(), removed: t.removed }));
    const s3 = s2.map(t => ({ text: t.text, removed: t.removed || STOP.has(t.text) }));
    const s4 = s3.map(t => t.removed ? { text: t.text, removed: true } : { text: stem(t.text), removed: false });
    return [s0, s1, s2, s3, s4];
  }

  function displayTokens(idx, all) {
    const cur = all[idx], prev = idx > 0 ? all[idx-1] : null;
    const out = [];
    for (let j = 0; j < cur.length; j++) {
      if (prev && prev[j].removed) continue;
      const t = cur[j], p = prev ? prev[j] : null;
      out.push({ text: t.text, removedNow: t.removed && (!p||!p.removed), changedNow: !t.removed && !!p && t.text !== p.text });
    }
    return out;
  }

  const STAGES = [
    { name: 'SimpleTokenizer', desc: 'split on whitespace & punctuation' },
    { name: 'RemoveLongFilter(max_term_len=256)', desc: 'drop tokens longer than 256 characters' },
    { name: 'LowerCaser', desc: 'normalize to lowercase' },
    { name: 'StopWordFilter', desc: 'remove common language stop words' },
    { name: 'Stemmer', desc: 'reduce tokens to their stem form' },
  ];

  function summary(idx, tokens) {
    const rem = tokens.filter(t => t.removedNow).length;
    const chg = tokens.filter(t => t.changedNow).length;
    const kpt = tokens.filter(t => !t.removedNow).length;
    return [
      `${kpt} token${kpt!==1?'s':''} extracted`,
      rem ? `${rem} token${rem>1?'s':''} dropped (length > ${MAX_TERM_LEN})` : `no tokens exceeded ${MAX_TERM_LEN} chars`,
      chg ? `${chg} token${chg>1?'s':''} normalized to lowercase` : 'all tokens already lowercase',
      rem ? `${rem} stop word${rem>1?'s':''} removed` : 'no stop words found',
      chg ? `${chg} token${chg>1?'s':''} reduced to stem form` : 'no stems applied',
    ][idx];
  }

  // ── DOM ───────────────────────────────────────────────────────────────────
  const card      = document.querySelector('.card');
  const cardName  = card.querySelector('.card-name');
  const cardNum   = card.querySelector('.card-num');
  const cardDesc  = card.querySelector('.card-desc');
  const tokenList = card.querySelector('.card-tokens');
  const cardSum   = card.querySelector('.card-summary');
  const dots      = Array.from(document.querySelectorAll('.dot'));
  const outputRow = document.querySelector('.output-row');
  const inputEl   = document.querySelector('.input-field');
  const runBtn    = document.querySelector('.run-btn');
  const s1shadow  = document.querySelector('.shadow-card.s1');
  const s2shadow  = document.querySelector('.shadow-card.s2');

  const R = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const wait = ms => R ? Promise.resolve() : new Promise(r => setTimeout(r, ms));

  async function fillCard(idx, tokens, animate) {
    const m = STAGES[idx];
    cardName.textContent = m.name;
    cardNum.textContent  = `${idx + 1} / ${STAGES.length}`;
    cardDesc.textContent = m.desc;
    cardSum.textContent  = summary(idx, tokens);
    const dot = document.createElement('span');
    dot.style.cssText = 'display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--blue);flex-shrink:0;margin-right:8px;';
    cardName.prepend(dot);
    tokenList.innerHTML = '';
    dots.forEach((d,i) => { d.classList.toggle('active', i===idx); d.classList.toggle('done', i<idx); });
    const pills = tokens.map(t => {
      const el = document.createElement('span');
      el.className = 'token' + (t.removedNow ? ' removed' : t.changedNow ? ' changed' : '');
      el.textContent = t.text;
      tokenList.appendChild(el);
      return el;
    });
    if (animate) { for (const p of pills) { await wait(R?0:46); p.classList.add('show'); } }
    else pills.forEach(p => p.classList.add('show'));
    const h = card.offsetHeight;
    s1shadow.style.height = h+'px';
    s2shadow.style.height = h+'px';
  }

  async function swipeTo(idx, tokens) {
    if (R) { await fillCard(idx, tokens, false); return; }
    card.style.transition = 'transform 0.34s cubic-bezier(0.55,0,0.85,0.3), opacity 0.34s ease-in, box-shadow 0.2s';
    card.style.transform  = 'translateX(-108%) translateY(14px) rotate(-9deg) scale(0.93)';
    card.style.opacity    = '0';
    card.style.boxShadow  = 'none';
    s1shadow.style.transition = 'transform 0.34s ease';
    s1shadow.style.transform  = 'scale(0.988) translateY(4px)';
    s2shadow.style.transition = 'transform 0.34s ease';
    s2shadow.style.transform  = 'scale(0.958) translateY(10px)';
    await wait(340);
    card.style.transition = 'none';
    card.style.transform  = 'translateX(5%) scale(0.98)';
    card.style.opacity    = '0';
    tokenList.innerHTML   = '';
    cardSum.textContent   = '';
    await fillCard(idx, tokens, false);
    card.offsetWidth;
    card.style.transition = 'transform 0.3s cubic-bezier(0.15,0,0.3,1), opacity 0.3s ease-out, box-shadow 0.3s';
    card.style.transform  = 'translateX(0) scale(1)';
    card.style.opacity    = '1';
    card.style.boxShadow  = '0 2px 14px var(--card-shadow)';
    s1shadow.style.transform = 'scale(0.965) translateY(9px)';
    s2shadow.style.transform = 'scale(0.930) translateY(18px)';
    await wait(300);
    const pills = Array.from(tokenList.querySelectorAll('.token'));
    for (const p of pills) { await wait(46); p.classList.add('show'); }
  }

  let running = false;
  async function run() {
    if (running) return;
    running = true; runBtn.disabled = true;
    card.style.transition = 'none'; card.style.transform = 'none';
    card.style.opacity = '1'; card.style.boxShadow = '0 2px 14px var(--card-shadow)';
    s1shadow.style.transition = 'none'; s1shadow.style.transform = 'scale(0.965) translateY(9px)';
    s2shadow.style.transition = 'none'; s2shadow.style.transform = 'scale(0.930) translateY(18px)';
    outputRow.classList.remove('visible');
    outputRow.querySelectorAll('.output-chip').forEach(c => c.remove());
    dots.forEach(d => { d.classList.remove('active','done'); });
    const input = inputEl.value.trim() || 'Machine learning models are Revolutionizing NLP';
    const all = pipeline(input);
    await wait(150);
    tokenList.innerHTML = '';
    await fillCard(0, displayTokens(0, all), true);
    for (let i = 1; i < STAGES.length; i++) {
      await wait(R ? 0 : 900);
      await swipeTo(i, displayTokens(i, all));
    }
    await wait(R ? 0 : 700);
    all[4].filter(t => !t.removed).forEach(t => {
      const chip = document.createElement('span');
      chip.className = 'output-chip'; chip.textContent = t.text;
      outputRow.appendChild(chip);
    });
    outputRow.classList.add('visible');
    running = false; runBtn.disabled = false;
  }

  runBtn.addEventListener('click', run);
  inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') run(); });
  if (R) { run(); }
  else { new IntersectionObserver(es => { if (es[0].isIntersecting) run(); }, { threshold: 0.3 }).observe(document.querySelector('.wrapper')); }
})();
</script>
</body>
</html>
